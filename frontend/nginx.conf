# Sirve el build estatico de React y hace que cualquier ruta que no sea un
# fichero real caiga en index.html, para que react-router-dom pueda
# resolverla del lado del cliente (p.ej. recargar /tournament/summary
# directamente no debe dar 404 en nginx).
#
# /api/ hace de proxy inverso hacia el backend en Railway: el navegador
# solo ve worlddraft.up.railway.app en todo momento, asi que la cookie de
# sesion (worlddraftauth) pasa a ser same-site respecto al frontend en vez
# de cross-site entre dos dominios *.up.railway.app distintos -- eso es lo
# que la hace fiable en navegadores que bloquean cookies de terceros
# (Safari ITP, el retiro progresivo en Chrome), sin depender de que
# SameSite=None+Secure siga funcionando entre sitios de verdad distintos.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # El trailing slash en ambos (location y proxy_pass) hace que
        # nginx recorte el prefijo /api/ al reenviar: una peticion del
        # frontend a /api/auth/login llega al backend como /auth/login,
        # que es la ruta real que expone app/main.py (sin prefijo /api).
        proxy_pass https://worlddraft-production.up.railway.app/;

        # Host explicito al hostname publico del backend (no al del
        # frontend, que es lo que traeria $host aqui): el edge de Railway
        # enruta por Host/SNI, asi que reenviar el Host original del
        # navegador mandaria la peticion al servicio equivocado -- o a
        # ninguno. proxy_ssl_server_name hace lo mismo para el SNI de la
        # conexion TLS saliente hacia el backend.
        proxy_set_header Host worlddraft-production.up.railway.app;
        proxy_ssl_server_name on;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Cookie, Origin, etc. via el navegador se reenvian tal cual por
        # defecto -- no hace falta declararlos aparte. Estos son solo para
        # que el backend vea la IP/proto real del cliente en sus logs.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
